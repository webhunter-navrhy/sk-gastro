{# Formulár objednávky. Endpoint a demo režim z _data/site.json (formular.endpoint, formular.demo). #}
<form class="formular" method="post" {% if site.formular.endpoint and not site.formular.demo %}action="{{ site.formular.endpoint }}"{% endif %} data-endpoint="{{ site.formular.endpoint }}" data-demo="{{ 1 if site.formular.demo or not site.formular.endpoint else 0 }}">
  <label>Meno alebo firma <input name="meno" autocomplete="name" required></label>
  <div class="dva">
    <label>Telefón <input name="telefon" type="tel" autocomplete="tel" required></label>
    <label>E-mail <input name="email" type="email" autocomplete="email"></label>
  </div>
  <label>Čo by ste chceli (výrobky, množstvo, kedy) <textarea name="sprava" rows="4" required></textarea></label>
  <div class="past" aria-hidden="true"><label>Nevypĺňať <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
  <input type="hidden" name="_subject" value="{{ site.formular.predmet }}">
  <button type="submit" class="btn btn-zlata">Odoslať</button>
  <p class="formular-stav" role="status" aria-live="polite"></p>
</form>
